<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>chordlang playground</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <header class="bar">
    <span class="wordmark">chordlang</span>
    <span class="tagline">text in · engraving out · <a class="demo-link" href="/graph/ii-v-i-chain">graph demo</a></span>
    <nav class="examples" id="examples"></nav>
  </header>
  <main class="split">
    <section class="pane pane-source">
      <label class="pane-label" for="source">source</label>
      <textarea id="source" spellcheck="false" autocomplete="off"></textarea>
    </section>
    <section class="pane pane-out">
      <div class="tabs" role="tablist">
        <button class="tab active" data-view="chart">Chart</button>
        <button class="tab" data-view="ast">AST</button>
        <button class="tab" data-view="canonical">Canonical</button>
      </div>
      <div id="view-chart" class="view active"><div id="page" class="page"></div></div>
      <pre id="view-ast" class="view json"></pre>
      <pre id="view-canonical" class="view json"></pre>
      <div id="status" class="status"></div>
    </section>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
