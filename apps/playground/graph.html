<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>chordlang — graph demo</title>
  <link rel="stylesheet" href="/src/graph.css" />
</head>
<body>
  <header class="bar">
    <a class="wordmark" id="chart-home" href="#">chordlang</a>
    <span class="tagline">harmonic graphs · engraved node labels</span>
    <nav class="examples" id="examples"></nav>
  </header>
  <main class="split">
    <section class="pane pane-source">
      <label class="pane-label" for="source">dot source</label>
      <textarea id="source" spellcheck="false" autocomplete="off"></textarea>
    </section>
    <section class="pane pane-out">
      <div class="pane-label">rendered graph</div>
      <div id="graph" class="graph-canvas"></div>
      <div id="status" class="status"></div>
    </section>
  </main>
  <script type="module" src="/src/graph.ts"></script>
</body>
</html>
