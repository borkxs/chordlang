<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" role="img" aria-labelledby="title desc">
  <title id="title">ChordFont GSUB pipeline</title>
  <desc id="desc">ASCII chord text flows through cmap, liga, accidental calt, and superscript calt into engraved glyphs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f3ea"/>
      <stop offset="100%" stop-color="#ebe4d6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.5 L9 5 L0 8.5 Z" fill="#3d4a3c"/>
    </marker>
    <style>
      .label { font: 600 13px "IBM Plex Sans", "Segoe UI", sans-serif; fill: #1c241c; }
      .sub { font: 500 11px "IBM Plex Mono", ui-monospace, monospace; fill: #4a5648; }
      .stage { fill: #fffdf8; stroke: #3d4a3c; stroke-width: 1.5; }
      .stage-accent { fill: #dfece0; stroke: #3d4a3c; stroke-width: 1.5; }
      .io { font: 700 15px "IBM Plex Mono", ui-monospace, monospace; fill: #1c241c; }
      .caption { font: 500 12px "IBM Plex Sans", "Segoe UI", sans-serif; fill: #5a6558; }
    </style>
  </defs>
  <rect width="860" height="220" rx="12" fill="url(#bg)"/>

  <rect x="24" y="70" width="110" height="72" rx="10" class="stage-accent"/>
  <text x="79" y="100" text-anchor="middle" class="io">Cmaj7</text>
  <text x="79" y="122" text-anchor="middle" class="sub">ASCII in</text>

  <line x1="140" y1="106" x2="168" y2="106" stroke="#3d4a3c" stroke-width="1.75" marker-end="url(#arrow)"/>

  <rect x="174" y="62" width="120" height="88" rx="10" class="stage"/>
  <text x="234" y="92" text-anchor="middle" class="label">cmap</text>
  <text x="234" y="112" text-anchor="middle" class="sub">chars to glyphs</text>
  <text x="234" y="130" text-anchor="middle" class="sub">C m a j d7</text>

  <line x1="300" y1="106" x2="328" y2="106" stroke="#3d4a3c" stroke-width="1.75" marker-end="url(#arrow)"/>

  <rect x="334" y="62" width="120" height="88" rx="10" class="stage"/>
  <text x="394" y="92" text-anchor="middle" class="label">liga</text>
  <text x="394" y="112" text-anchor="middle" class="sub">m a j to triangle</text>
  <text x="394" y="130" text-anchor="middle" class="sub">C maj.tri d7</text>

  <line x1="460" y1="106" x2="488" y2="106" stroke="#3d4a3c" stroke-width="1.75" marker-end="url(#arrow)"/>

  <rect x="494" y="62" width="132" height="88" rx="10" class="stage"/>
  <text x="560" y="88" text-anchor="middle" class="label">calt</text>
  <text x="560" y="108" text-anchor="middle" class="sub">root vs alt</text>
  <text x="560" y="126" text-anchor="middle" class="sub">accidentals</text>

  <line x1="632" y1="106" x2="660" y2="106" stroke="#3d4a3c" stroke-width="1.75" marker-end="url(#arrow)"/>

  <rect x="666" y="62" width="170" height="88" rx="10" class="stage-accent"/>
  <text x="751" y="92" text-anchor="middle" class="label">calt / superscript</text>
  <text x="751" y="112" text-anchor="middle" class="sub">after alt / paren</text>
  <text x="751" y="130" text-anchor="middle" class="io">C maj.tri 7</text>

  <text x="430" y="190" text-anchor="middle" class="caption">HarfBuzz / CoreText / DirectWrite apply these features. No JavaScript at render time.</text>
</svg>
