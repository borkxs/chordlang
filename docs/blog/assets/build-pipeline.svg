<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200" role="img" aria-labelledby="title desc">
  <title id="title">ChordFont build pipeline</title>
  <desc id="desc">Petaluma outlines are extracted, assembled with OpenType features, and verified by HarfBuzz shape tests.</desc>
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f3efe4"/>
      <stop offset="100%" stop-color="#e6dfd0"/>
    </linearGradient>
    <marker id="arr4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.5 L9 5 L0 8.5 Z" fill="#3d4a3c"/>
    </marker>
    <style>
      .box { fill: #fffdf8; stroke: #3d4a3c; stroke-width: 1.5; }
      .box-hi { fill: #dfece0; stroke: #3d4a3c; stroke-width: 1.5; }
      .t { font: 700 13px "IBM Plex Sans", "Segoe UI", sans-serif; fill: #1c241c; }
      .s { font: 500 11px "IBM Plex Mono", ui-monospace, monospace; fill: #4a5648; }
      .cap { font: 500 12px "IBM Plex Sans", "Segoe UI", sans-serif; fill: #5a6558; }
    </style>
  </defs>
  <rect width="860" height="200" rx="12" fill="url(#bg4)"/>

  <rect x="28" y="48" width="140" height="84" rx="10" class="box"/>
  <text x="98" y="82" text-anchor="middle" class="t">Petaluma</text>
  <text x="98" y="102" text-anchor="middle" class="s">OTF sources</text>
  <text x="98" y="118" text-anchor="middle" class="s">make fetch</text>

  <line x1="176" y1="90" x2="204" y2="90" stroke="#3d4a3c" stroke-width="1.75" marker-end="url(#arr4)"/>

  <rect x="210" y="48" width="150" height="84" rx="10" class="box"/>
  <text x="285" y="82" text-anchor="middle" class="t">extract</text>
  <text x="285" y="102" text-anchor="middle" class="s">source_map.json</text>
  <text x="285" y="118" text-anchor="middle" class="s">make extract</text>

  <line x1="368" y1="90" x2="396" y2="90" stroke="#3d4a3c" stroke-width="1.75" marker-end="url(#arr4)"/>

  <rect x="402" y="48" width="160" height="84" rx="10" class="box-hi"/>
  <text x="482" y="78" text-anchor="middle" class="t">FontBuilder</text>
  <text x="482" y="98" text-anchor="middle" class="s">outlines + .fea</text>
  <text x="482" y="114" text-anchor="middle" class="s">make build</text>

  <line x1="570" y1="90" x2="598" y2="90" stroke="#3d4a3c" stroke-width="1.75" marker-end="url(#arr4)"/>

  <rect x="604" y="48" width="120" height="84" rx="10" class="box"/>
  <text x="664" y="82" text-anchor="middle" class="t">TTF</text>
  <text x="664" y="102" text-anchor="middle" class="s">Real Book</text>
  <text x="664" y="118" text-anchor="middle" class="s">+ Pop</text>

  <line x1="732" y1="90" x2="760" y2="90" stroke="#3d4a3c" stroke-width="1.75" marker-end="url(#arr4)"/>

  <rect x="766" y="48" width="70" height="84" rx="10" class="box-hi"/>
  <text x="801" y="90" text-anchor="middle" class="t">test</text>
  <text x="801" y="110" text-anchor="middle" class="s">hb</text>

  <text x="430" y="172" text-anchor="middle" class="cap">Outlines, GSUB features, and ASCII input grammar stay separate: swap one without rewriting the others</text>
</svg>
