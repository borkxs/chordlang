name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: make test
      - run: make lint

  preview-cross-platform:
    # Informational: Test that preview generation works across platforms
    # Font correctness is tested via shape tests, not screenshot comparison
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium --with-deps
      
      - name: Test preview generation
        run: make previews
        
      - name: Report status
        shell: bash
        run: |
          echo "✓ Preview generation works on ${{ matrix.os }}"
          echo ""
          echo "Note: Preview images are documentation artifacts, not tests."
          echo "Font correctness is validated by shape tests (packages/font/tests/)."
