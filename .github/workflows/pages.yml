name: Deploy playground to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run grammar
      - run: GITHUB_PAGES=true pnpm --filter @chordlang/playground build
        env:
          NODE_ENV: production

      # ChordFont lookbook — static QA page, not linked from the playground UI.
      # Served at /chordlang/lookbook/ using the committed playground TTF snapshot.
      - name: Build lookbook into Pages artifact
        run: |
          node --experimental-strip-types tools/lookbook/render-lookbook.ts \
            --font "apps/playground/public/fonts/ChordFont-Real Book.ttf"
          mkdir -p apps/playground/dist/lookbook
          cp tools/lookbook/lookbook.html apps/playground/dist/lookbook/index.html
          cp -R tools/lookbook/refs apps/playground/dist/lookbook/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/playground/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
